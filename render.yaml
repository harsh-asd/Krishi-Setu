databases:
  # 1. PostgreSQL Database
  - name: krishisetu-db
    plan: free

services:
  # 2. Node.js Backend Server
  - type: web
    name: krishisetu-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: krishisetu-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SMS_ENABLED
        value: "false"

  # 3. React Frontend (Vite)
  - type: web
    name: krishisetu-frontend
    env: static
    buildCommand: export VITE_API_URL=${API_BACKEND_URL}/api && npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: API_BACKEND_URL
        fromService:
          type: web
          name: krishisetu-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
